# ============================================================================
# L2Q3 Data-model schema (second measurement system — full machine-readable version)
# Cubre les 16 preguntes de l'enquesta (inclús C6 d'accesibilidad), amb els camps
# desmullats d'E1/E2, per un total de 18 categories de pregunta.
#
# ⚠️ Nombre de preguntes vs nombre de camps (per evitar ambigüetat): l'enquesta es
#     compten per «preguntes de matriz = 1 pregunta» = 15 preguntes (pla §4) / 16 preguntes
#     (inclús C6); però per a llegibilitat per màquina, E1(obáculos) es desa en 7 camps, E2(intenació)
#     en 4 camps i C3(son) en 2 camps, per així donar ~25 question_id a nivell de camp (veure
#     question_field_map.md). «10–15 preguntes» es compten per matriz; la desmultiació de camps
#     d'aquest schema és un detall d'implementació que no canvia el conte de preguntes.
#
# Cada objecte de pregunta inclou i sols inclou les claus següents:
#   question_id   camp ID (p. ej. generes, situacio, obstacle_1, intencio_1, ...)
#   escalar        ordinal | binary | categorical | interval | ratio
#   sentit         positive | negative (amb sentit per a ordinal/interval; binary/categorical = null)
#   pregunta_a     well_defined | well_defined_n_excluded
#   track_pairing  true | false (sols per a canvi_benestar / longitudinal = true)
#   options        [{label: <català original>, value: <enter>}, ...], value coherent amb escalar
#   denominators   nom del denominador (string), cita la name del denominadors[] del capçala
#   estat          nom de la taula d'estadístiques corresponent (cita metric / table del metrics[])
#   description    una frase d'explicació en castella
#
# estat valors: nom de la «taula d'estadístiques» (p. ej. freq_esport, obstacles_noesport),
#              orthogonal al concepte de «marcar la qualitat d'una resposta (resposta/no_resposta…)»
#              que valid.py marca segons l'estat.
# ============================================================================

schema:
  version: "2.0"
  source: "pla §5.1 + enquesta原文 (15 preguntes)"
  language: "ca"          # idioma de l'enquesta原文 (català)
  privacy_rule: "Subgrups n<30 no es mostren; n_min_privacy és una recomanació d'ull de privacitat, no és una garantia"

# —— Identificador d'onda (wave del capçala) i panell longitudinal (T0 baseline, T1 punt d'ancoratge de remesa) ——
wave: "L2Q3-2026"
# Nota: aquest schema és el [marc de disseny] de la segona mesura del 2027.
# Les dades reals de T0(2026-09)/T1(2026-11) encara no es recolen; en aquesta entrega (2026) sols es dóna el marc,
# i no es produeixen conclusions longitudinals reals (una conclusió longitudinal necessita dos aplicacions independents T0→T1 l'any que venix).
wave_panel:
  - wave_id: T0
    role: "Entrada de nous membres / baseline"
    data_inici: "2026-09-15"
    canal: "web"
    invitats: 400
    respostes: 280
  - wave_id: T1
    role: "Remesa voluntària / punt d'incorregut"
    data_inici: "2026-11-20"
    canal: "web"
    invitats: 280
    respostes: 205

# —— Metadades a nivell de respondent (col0 / col1) ——
respondent:
  respondent_id:
    type: "string/enum"
    scope: "all"
    col: 0
    description: "respondent anònim, sans nom / nº d'estudiant / correu (privacitat)"
  wave:
    type: "string/enum"
    scope: "all"
    col: 1
    description: "onda unificada (metadades)"

# —— Índex pregunta→camp (question[], índex concís; questions[] és la definició completa) ——
question:
  - generes
  - situacio
  - abonat
  - frecuencia
  - habit_estar
  - salut_fisica
  - estat_emocional
  - son_hores
  - son_qualitat
  - estres
  - beneficis
  - pertinenca
  - accesibilidad
  - obstacle_1
  - obstacle_2
  - obstacle_3
  - obstacle_4
  - obstacle_5
  - obstacle_6
  - obstacle_7
  - intencio_1
  - intencio_2
  - intencio_3
  - intencio_4
  - canvi_benestar

# —— Definició completa de pregunta (17 categories) ——
questions:
  # A1 gènere (metadades de tothom)
  - question_id: generes
    escalar: categorical
    sentit: null
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Home", value: 1}          # home
      - {label: "Dona", value: 2}          # donna
      - {label: "No binari", value: 3}     # no binari
      - {label: "Sense opinions", value: 4}  # sense opinió
    denominators: all_valid
    estat: "pertinencia_generes"
    description: "A1 gène, tothom recollit and, per a creure de gène × pertinença."

  # A3 situació (clau de grup): situacio∈{1,2}→practicans movers_n; situacio=3→no-practicans nonmovers_n
  - question_id: situacio
    escalar: categorical
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "Mol habitual", value: 1}       # regular/constant (clau de grup = practicans)
      - {label: "Aquest any he començat", value: 2}  # només aquest any (= practicans)
      - {label: "No Fa esport", value: 3}       # no practica (= no-practicans, ramificació a E1/E2)
    denominators: all_valid
    estat: "situacio_grups"
    description: "A3 situació, clau de grup; nota a l'explicació de la regla de denominador: {1,2}→movers_n, {3}→nonmovers_n."

  # A4 ¿membre? (tothom)
  - question_id: abonat
    escalar: binary
    sentit: null
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Sí", value: 1}
      - {label: "No", value: 2}
    denominators: abonat_sisi
    estat: "abonat_grups"
    description: "A4 ¿membre?, tothom, denominador = nombre de membres (Sí)."

  # B1 freqüència (sols practicans, falten 106)
  - question_id: frecuencia
    escalar: ordinal
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "1 cop setmana", value: 1}      # 1 setmanal
      - {label: "2-3 cop setmana", value: 2}    # 2-3 setmanals
      - {label: "4-5 cop setmana", value: 3}    # 4-5 setmanals
      - {label: "Més de 5 cop setmana", value: 4}  # >5 setmanals (llim de 4 dies)
    denominators: movers_n
    estat: "freq_esport"
    description: "B1 freqüència, sols practicans n(A3∈1,2), falten 106; llim de 4 dies per decidir l'assoliment."

  # B3 ¿assolit? (sols practicans)
  - question_id: habit_estar
    escalar: ordinal
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No assolit", value: 1}   # no assolit
      - {label: "Gairebé assolit", value: 2}  # gairebé assolit
      - {label: "Assolit", value: 3}      # assolit
    denominators: movers_n
    estat: "habit_arrel"
    description: "B3 ¿assolit?, sols practicans; 1=no assolit, 2=gairbé assolit, 3=assolit."

  # C1 salud física (tothom, positiu)
  - question_id: salut_fisica
    escalar: interval
    sentit: positive
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Mol malament", value: 1}
      - {label: "Malament", value: 2}
      - {label: "Normal", value: 3}
      - {label: "Bé", value: 4}
      - {label: "Mol bé", value: 5}
    denominators: all_valid
    estat: "salut_fisica"
    description: "C1 salud física, tothom int 1-5, positiu."

  # C2 ànim (tothom, positiu)
  - question_id: estat_emocional
    escalar: interval
    sentit: positive
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Mol malament", value: 1}
      - {label: "Malament", value: 2}
      - {label: "Normal", value: 3}
      - {label: "Bé", value: 4}
      - {label: "Mol bé", value: 5}
    denominators: all_valid
    estat: "estat_emocional"
    description: "C2 ànim, tothom int 1-5, positiu."

  # C3 hores de son (tothom, interval, no monòton)
  - question_id: son_hores
    escalar: ordinal
    sentit: null
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "0-1 h", value: 1}
      - {label: "2-3 h", value: 2}
      - {label: "4-5 h", value: 3}
      - {label: "6-7 h", value: 4}
      - {label: "8-9 h", value: 5}
      - {label: ">9 h", value: 6}
    denominators: all_valid
    estat: "son_hores"
    description: "C3 hores de son, tothom ordered int; no monòton (el millor és intermedi), per així sentit=null."

  # C3 qualitat de son (tothom, positiu)
  - question_id: son_qualitat
    escalar: interval
    sentit: positive
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Mol dolent", value: 1}
      - {label: "Dolent", value: 2}
      - {label: "Normal", value: 3}
      - {label: "Bé", value: 4}
      - {label: "Mol bé", value: 5}
    denominators: all_valid
    estat: "son_qualitat"
    description: "C3 qualitat de son, tothom int 1-5, positiu (desmultiat en dos camps de les «hores» i «qualitat»)."

  # C4 estrès (tothom, de freqüència, puntuació negativa)
  - question_id: estres
    escalar: ordinal
    sentit: negative
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Mai", value: 1}              # mai
      - {label: "Una cop / mes", value: 2}    # una setmanada / mes
      - {label: "2-3 cop / mes", value: 3}    # 2-3 setmanada / mes
      - {label: "Setmanal", value: 4}         # setmanal
      - {label: "Molt sovint", value: 5}      # molt sovint
    denominators: all_valid
    estat: "estres_freq"
    description: "C4 estrès, tothom int 1-5 de freqüència (col20-23); sentit=negative, més freqüència més estrès (puntuació inversa)."

  # C5 beneficis (sols practicans, positiu)
  - question_id: beneficis
    escalar: interval
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "Mol d'en contra", value: 1}
      - {label: "D'en contra", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "D'acord", value: 4}
      - {label: "Mol d'acord", value: 5}
    denominators: movers_n
    estat: "benefici_movers"
    description: "C5 beneficis, sols practicans n(practicans) int 1-5, positiu (col11-15)."

  # D1 vincle/pertinença (tothom, positiu)
  - question_id: pertinenca
    escalar: interval
    sentit: positive
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Mol d'en contra", value: 1}
      - {label: "D'en contra", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "D'acord", value: 4}
      - {label: "Mol d'acord", value: 5}
    denominators: all_valid
    estat: "pertinencia"
    description: "D1 vincle/pertinença, tothom int 1-5, positiu (col27-30)."

  # C6 percepció d'accesibilidad/equitat (tothom, positiu) — P1: pregunta complement d'mesura directa d'equitat
  - question_id: accesibilidad
    escalar: ordinal
    sentit: positive
    pregunta_a: well_defined
    track_pairing: false
    options:
      - {label: "Muy difícil", value: 1}   # molt difícil (no accesible)
      - {label: "Difícil", value: 2}       # una mica difícil
      - {label: "Neutral", value: 3}       # normal
      - {label: "Fácil", value: 4}         # una mica accessible
      - {label: "Muy fácil", value: 5}     # molt accessible (equitat i accesible)
    denominators: all_valid
    estat: "accesibilidad_grups"
    description: "C6 percepció d'accesibilidad/equitat (mesura directa d'equitat): com percebs l'accesibilitat del servei del SAF per a tu, 1=molt difícil…5=molt accessible; tothom, positiu."

  # E1 obáculos (mult comprès en 7 camps 0/1 independents, sols no-practicans)
  - question_id: obstacle_1
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-1 obstacle= no hi ha temps / s'estudia molt; sols no-practicans, camp 0/1."
  - question_id: obstacle_2
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-2 obstacle= lluny / no hi ha transport; sols no-practicans, camp 0/1."
  - question_id: obstacle_3
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-3 obstacle= car / no hi ha descompte de membre; sols no-practicans, camp 0/1."
  - question_id: obstacle_4
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-4 obstacle= no m'interessa / no hi ha preferència esportiva; sols no-practicans, camp 0/1."
  - question_id: obstacle_5
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-5 obstacle= raons físiques / lesions; sols no-practicans, camp 0/1."
  - question_id: obstacle_6
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-6 obstacle= falta companyia / ningú per anar-hi; sols no-practicans, camp 0/1."
  - question_id: obstacle_7
    escalar: binary
    sentit: null
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No", value: 0}
      - {label: "Sí", value: 1}
    denominators: nonmovers_n
    estat: "obstacles_noesport"
    description: "E1-7 obstacle= falta vestidor / instal·lacions; sols no-practicans, camp 0/1."

  # E2intenació (4 tipus d'incentius en camps, sols no-practicans, int 1-5)
  - question_id: intencio_1
    escalar: interval
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No gens d'intenció", value: 1}
      - {label: "Poca intenció", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "Molta intenció", value: 4}
      - {label: "Moltíssima intenció", value: 5}
    denominators: nonmovers_n
    estat: "intencio_noesport"
    description: "E2-1intenació=incentiu de preu / descompte de membre; sols no-practicans, int 1-5, positiu."
  - question_id: intencio_2
    escalar: interval
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No gens d'intenció", value: 1}
      - {label: "Poca intenció", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "Molta intenció", value: 4}
      - {label: "Moltíssima intenció", value: 5}
    denominators: nonmovers_n
    estat: "intencio_noesport"
    description: "E2-2intenació=incentiu de flexibilitat de temps / classe; sols no-practicans, int 1-5, positiu."
  - question_id: intencio_3
    escalar: interval
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No gens d'intenció", value: 1}
      - {label: "Poca intenció", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "Molta intenció", value: 4}
      - {label: "Moltíssima intenció", value: 5}
    denominators: nonmovers_n
    estat: "intencio_noesport"
    description: "E2-3intenació=incentiu social / companyia / comunitat; sols no-practicans, int 1-5, positiu."
  - question_id: intencio_4
    escalar: interval
    sentit: positive
    pregunta_a: well_defined_n_excluded
    track_pairing: false
    options:
      - {label: "No gens d'intenció", value: 1}
      - {label: "Poca intenció", value: 2}
      - {label: "Neutral", value: 3}
      - {label: "Molta intenció", value: 4}
      - {label: "Moltíssima intenció", value: 5}
    denominators: nonmovers_n
    estat: "intencio_noesport"
    description: "E2-4intenació=incentiu de beneficis de salut / orientació; sols no-practicans, int 1-5, positiu."

  # E3 ancora longitudinal (tothom, comparació fa un any, negatiu→positiu)
  - question_id: canvi_benestar
    escalar: ordinal
    sentit: positive
    pregunta_a: well_defined
    track_pairing: true
    options:
      - {label: "Mol pitjor", value: 1}  # fa un any pitjor (originalnegatiu)
      - {label: "Pitjor", value: 2}
      - {label: "Igual", value: 3}
      - {label: "Millor", value: 4}
      - {label: "Mol millor", value: 5}  # ara millor (positiu)
    denominators: all_valid
    estat: "canvi_benestar_panel"
    description: "E3 ancora longitudinal, tothom enum 1-5; comparació fa un any, negatiu→positiu (més gran millor); track_pairing=true. El parellament longitudinal necessita dos aplicacions independents T0→T1 — aquest schema és el [marc longitudinal] de la segona mesura del 2027; les dades reals de T0/T1 encara no es recolen, en aquesta entrega (2026) sols es dóna el marc i no es produeixen conclusions longitudinals reals."

# —— Definició de denominador (Denominator) ——
denominators:
  - name: all_valid
    scope: "Tothom recollit and de valid"
    n_min_conclusion: 30
    n_min_privacy: 30
    description: "Denominador de tothom recollit and de valid, aplicable a totes les preguntes (A1/A3/A4/C1/C2/C3/C4/D1/E3)."
  - name: movers_n
    scope: "Practicans = A3∈{Regular, Fa-un-any} (situacio∈{1,2})"
    n_min_conclusion: 30
    n_min_privacy: 30
    description: "Denominador de practicans, aplicable a B1/B3/C5 (criteri de practicans). Falten 106 respostes."
  - name: abonat_sisi
    scope: "Denominador de membres = A4=Sí"
    n_min_conclusion: 30
    n_min_privacy: 30
    description: "Denominador de membres (Sí), per al percentual de membres de A4."
  - name: nonmovers_n
    scope: "No-practicans = A3=no practica (situacio=3)"
    n_min_conclusion: 30
    n_min_privacy: 30
    target_n: 150
    description: "Denominador de no-practicans, per a E1 obacles / E2intenació; n_min_conclusion ha de garantir ≥30, target ≥150."

# —— Índex / taula d'estadístiques (Metric) — per a citar-lo des de question.estat
metrics:
  - metric: situacio_grups
    by: situacio
    denominator: all_valid
    table: situacio_grups
    groups: ["1 Regular", "2 Fa-un-any", "3 No-practica"]
    min_n: 30
  - metric: abonat_grups
    by: abonat
    denominator: abonat_sisi
    table: abonat_grups
    groups: ["Sí", "No"]
    min_n: 30
  - metric: freq_esport
    by: frecuencia
    denominator: movers_n
    table: freq_esport
    groups: ["1 setmanal", "2-3 setmanals", "4-5 setmanals", ">5 setmanals"]
    min_n: 30
  - metric: habit_arrel
    by: habit_estar
    denominator: movers_n
    table: habit_arrel
    groups: ["No assolit", "Gairebé assolit", "Assolit"]
    min_n: 30
  - metric: salut_fisica
    by: salut_fisica
    denominator: all_valid
    table: salut_fisica
    min_n: 30
  - metric: estat_emocional
    by: stat_emocional
    denominator: all_valid
    table: estat_emocional
    min_n: 30
  - metric: son_hores
    by: son_hores
    denominator: all_valid
    table: son_hores
    min_n: 30
  - metric: son_qualitat
    by: son_qualitat
    denominator: all_valid
    table: son_qualitat
    min_n: 30
  - metric: estres_freq
    by: estres
    denominator: all_valid
    table: estres_freq
    min_n: 30
    sentit: negative
  - metric: benefici_movers
    by: beneficis
    denominator: movers_n
    table: benefici_movers
    min_n: 30
  - metric: pertinencia_generes
    by: pertinenca
    split_by: generes
    denominator: all_valid
    table: pertinencia_generes
    groups: ["male", "female", "other"]
    min_n: 30
  - metric: pertinencia
    by: pertinenca
    denominator: all_valid
    table: pertinencia
    min_n: 30
  - metric: accesibilidad_grups
    by: accesibilidad
    denominator: all_valid
    table: accesibilidad_grups
    min_n: 30
  - metric: obstacles_noesport
    by: [obstacle_1, obstacle_2, obstacle_3, obstacle_4, obstacle_5, obstacle_6, obstacle_7]
    denominator: nonmovers_n
    table: obstacles_noesport
    min_n: 30
  - metric: intencio_noesport
    by: [intencio_1, intencio_2, intencio_3, intencio_4]
